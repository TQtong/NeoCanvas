name: neocanvas

services:
  web:
    image: neocanvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.docker}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env.docker}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
        NEXT_PUBLIC_IMAGE_EDITING_ENABLED: ${NEXT_PUBLIC_IMAGE_EDITING_ENABLED:-false}
        SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    environment:
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
      NEXT_PUBLIC_IMAGE_EDITING_ENABLED: ${NEXT_PUBLIC_IMAGE_EDITING_ENABLED:-false}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${NEOCANVAS_PORT:-3100}:3100'
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3100/login']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
