name: quality

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  full-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Supabase services
        run: npx supabase start -x edge-runtime

      - name: Export public local Supabase configuration
        shell: bash
        run: |
          status="$(npx supabase status --output json)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' <<<"$status")" >> "$GITHUB_ENV"

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete quality gate
        run: npm run check

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
