# ============================================================================
# Supabase 项目配置（NeoCanvas）
#
# 内部型函数（消费队列、轮询、回调）不面向客户端，关闭网关 JWT 校验：消费 / 轮询由
# 服务角色触发并在代码内以服务角色运行；回调由外部提供商调用、以签名校验代替 JWT。
# 面向客户端的函数保留默认 JWT 校验，并在代码内二次校验调用者身份与归属。
# ============================================================================

project_id = "neocanvas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "500MiB"

# ---- 本地日志分析（Logflare + Vector）----
# 在 Windows/Docker Desktop 上，vector 读取 docker.sock 常因「Connection refused」反复重启，
# 进而拖垮 analytics 与 edge_runtime（边缘函数对外请求会报 name resolution failed）。
# 本地开发不需要日志分析管线，关闭它以让 edge_runtime 独立、稳定运行。
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ---- 第三方 OAuth：Google ----
# 启用前置：在 Google Cloud Console 建一个「Web 应用」OAuth 客户端，并把下列回调地址
# 加入「已授权的重定向 URI」（注意是 Supabase 的回调，不是应用的）：
#   http://127.0.0.1:54321/auth/v1/callback
# 凭据从项目根目录 .env 的 GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_SECRET 读取。
# 修改后需 `npm run db:stop && npm run db:start` 重启生效。
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = true

# ---- Edge Functions ----
[functions.create-project]
verify_jwt = true

[functions.submit-generation]
verify_jwt = true

[functions.agent-orchestrate]
verify_jwt = true

[functions.export-canvas]
verify_jwt = true

[functions.regenerate-poster]
verify_jwt = true

[functions.process-generation-queue]
verify_jwt = false

[functions.poll-generations]
verify_jwt = false

[functions.cleanup-generation-staging]
verify_jwt = false

[functions.generation-webhook]
verify_jwt = false

[functions.provider-credentials]
verify_jwt = true

[functions.swap-media-candidate]
verify_jwt = true

[functions.workflow-execute]
verify_jwt = true

[functions.workflow-agent]
verify_jwt = true

[functions.workflow-publish]
verify_jwt = true

[functions.process-workflow-queue]
verify_jwt = false
